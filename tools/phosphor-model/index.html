<!doctype html><html data-theme="dark"><meta charset="utf-8"><title>PICO presentation model</title>
<link rel="stylesheet" href="/style.css"><style>
.surface{position:relative;overflow:hidden;border-radius:6px}.surface .layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.surface .glow{opacity:.16;filter:blur(1.2px);mix-blend-mode:screen;image-rendering:auto}.surface .mask{background-size:100% 100%}.surface canvas{border-radius:0}#keyboard{position:fixed;left:-1px;top:0;width:1px;height:1px;opacity:0}#status{font-size:12px;white-space:pre-wrap}
</style><header class="bar"><strong>PICO presentation model</strong><div><button id="raw">Raw view</button><select id="candidate"><option>R</option><option>S</option><option>G</option><option>L</option></select><select id="frame"></select><select id="width"><option>32</option><option>40</option><option selected>80</option></select><label><input id="off" type="checkbox">Mask off</label></div></header>
<main><section class="monitor"><h2>Frozen PICO frame</h2><div id="surface" class="surface"><canvas id="sharp" width="1024" height="768" tabindex="0" aria-label="PICO model screen"></canvas><canvas id="glow" class="layer glow" width="1024" height="768"></canvas><div id="mask" class="layer mask"></div></div><pre id="status"></pre><textarea id="keyboard" aria-label="Model keyboard"></textarea></section><section><h2>Isolation sentinels</h2><canvas id="glcd" width="256" height="128"></canvas><pre id="serial">SERIAL unchanged</pre><pre id="keys"></pre></section></main>
<script type="module" src="/tools/phosphor-model/view.mjs"></script></html>
